name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -B -m unittest discover -s tests -q
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tests/test_javascript_optimization_analysis.js tests/test_javascript_exclusive_result.js
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Run C/PowerShell measurement-order integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_run_all_measurement_order.ps1
      - name: Run local-main synchronization safety tests
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: Never
        run: ./tests/test_sync_local_main.ps1
