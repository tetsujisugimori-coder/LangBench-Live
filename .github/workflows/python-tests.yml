name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -B -m unittest discover -s tests -q
      - name: Validate analysis package with hosted fixtures only
        run: python -B -m unittest tests.test_function_call_analysis_package -q
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tests/test_javascript_optimization_analysis.js tests/test_javascript_exclusive_result.js
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Run hosted Windows analysis fixture without publishing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = (Resolve-Path '.').Path
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') { throw 'cannot identify fixture source SHA' }
          $shared = Join-Path $env:RUNNER_TEMP 'function-call-analysis-shared-clone'
          $output = Join-Path $env:RUNNER_TEMP 'function-call-analysis-hosted-fixture'
          if ((Test-Path -LiteralPath $shared) -or (Test-Path -LiteralPath $output)) { throw 'fixture path already exists' }
          try {
            git clone --quiet --no-local --no-checkout $sourceRoot $shared
            if ($LASTEXITCODE -ne 0) { throw 'failed to create hosted shared fixture clone' }
            git -C $shared switch --quiet -c main $sourceSha
            if ($LASTEXITCODE -ne 0) { throw 'failed to create fixture main branch' }
            if ((git -C $shared rev-parse HEAD).Trim() -ne $sourceSha) { throw 'fixture clone SHA differs' }
            $sharedBranch = @(git -C $shared symbolic-ref --quiet --short HEAD)
            if ($LASTEXITCODE -ne 0 -or $sharedBranch.Count -ne 1 -or $sharedBranch[0] -ne 'main') { throw 'fixture clone is not on main' }
            ./tools/generate_function_call_analysis.ps1 -AnalysisId hosted-windows-fixture -OutputDirectory $output -SharedRepositoryPath $shared -AllowedRemote $sourceRoot
            python -B ./tools/validate_function_call_analysis.py $output --expected-sha $sourceSha
            python -B ./tools/check_function_call_artifact_safety.py $output
            if ($LASTEXITCODE -ne 0) { throw 'hosted artifact safety scan failed' }
            $state = Get-Content -LiteralPath (Join-Path $output 'run-state.json') -Raw | ConvertFrom-Json
            $validation = Get-Content -LiteralPath (Join-Path $output 'validation.json') -Raw | ConvertFrom-Json
            if ($state.status -ne 'success' -or $state.stages.validator.status -ne 'success' -or $validation.status -ne 'valid') { throw 'hosted artifact state is incomplete' }
          } finally {
            if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
            if (Test-Path -LiteralPath $shared) { Remove-Item -LiteralPath $shared -Recurse -Force }
          }
      - name: Test analysis shared-operation lock
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_generate_function_call_analysis.ps1
      - name: Run C/PowerShell measurement-order integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_run_all_measurement_order.ps1
      - name: Run local-main synchronization safety tests
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: Never
        run: ./tests/test_sync_local_main.ps1
