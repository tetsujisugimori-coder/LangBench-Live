name: Pull local main after verified merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-local-main-windows
  cancel-in-progress: false

jobs:
  verify-merge:
    runs-on: ubuntu-latest
    outputs:
      merge_sha: ${{ steps.verify.outputs.merge_sha }}
    steps:
      - name: Verify that the main update belongs to a merged PR
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test '${{ github.repository }}' = 'tetsujisugimori-coder/LangBench-Live'
          test '${{ github.ref }}' = 'refs/heads/main'
          prs=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${{ github.repository }}/commits/$TARGET_SHA/pulls")
          merge_sha=$(jq -r --arg sha "$TARGET_SHA" '[.[] | select(.merged_at != null and .base.ref == "main" and .base.repo.full_name == "${{ github.repository }}") | select(.merge_commit_sha == $sha or .merge_commit_sha != null)] | if length == 1 then .[0].merge_commit_sha else empty end' <<<"$prs")
          test -n "$merge_sha" || { echo 'No unique merged PR corresponds to this update.'; exit 1; }
          gh api "/repos/${{ github.repository }}/compare/$merge_sha...$TARGET_SHA" --jq 'select(.status == "ahead" or .status == "identical")' >/dev/null
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
  pull-main:
    needs: verify-merge
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update existing Windows working copy with trusted main code
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: Never
        run: ./tools/sync_local_main.ps1 -RepositoryPath 'C:\Users\tetsu\Documents\Codex\LangBench-Live' -TargetSha '${{ github.sha }}' -MergeSha '${{ needs.verify-merge.outputs.merge_sha }}'
