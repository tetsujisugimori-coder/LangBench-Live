name: Pull local main after verified merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-local-main-windows
  cancel-in-progress: false

jobs:
  verify-merge:
    runs-on: ubuntu-latest
    outputs:
      merge_sha: ${{ steps.verify.outputs.merge_sha }}
      pr_number: ${{ steps.verify.outputs.pr_number }}
      pr_head_sha: ${{ steps.verify.outputs.pr_head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify that the main update belongs to a merged PR
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${{ github.repository }}/commits/$TARGET_SHA/pulls" > "$RUNNER_TEMP/pulls.json"
          merge_sha=$(jq -r '[.[] | select(.merged_at != null and .base.ref == "main" and .base.repo.full_name == "${{ github.repository }}" and .merge_commit_sha != null)] | if length == 1 then .[0].merge_commit_sha else empty end' "$RUNNER_TEMP/pulls.json")
          test -n "$merge_sha" || { echo 'No unique merged PR corresponds to this update.'; exit 1; }
          compare_status=$(gh api "/repos/${{ github.repository }}/compare/$merge_sha...$TARGET_SHA" --jq '.status')
          result=$(python -B tools/verify_merge_gate.py --repository '${{ github.repository }}' --ref '${{ github.ref }}' --target-sha "$TARGET_SHA" --pulls "$RUNNER_TEMP/pulls.json" --compare-status "$compare_status")
          echo "merge_sha=$(jq -r '.merge_sha' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r '.pr_number' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$(jq -r '.pr_head_sha' <<<"$result")" >> "$GITHUB_OUTPUT"
  pull-main:
    needs: verify-merge
    runs-on: [self-hosted, Windows, X64, langbench-live-tetsu-windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update existing Windows working copy with trusted main code
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: Never
        run: ./tools/sync_local_main.ps1 -RepositoryPath 'C:\Users\tetsu\Documents\Codex\LangBench-Live' -TargetSha '${{ github.sha }}' -MergeSha '${{ needs.verify-merge.outputs.merge_sha }}' -PullRequestHeadSha '${{ needs.verify-merge.outputs.pr_head_sha }}' -PullRequestNumber '${{ needs.verify-merge.outputs.pr_number }}'
