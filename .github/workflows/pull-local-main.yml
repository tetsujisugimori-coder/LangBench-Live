name: Pull local main (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-local-main-windows
  cancel-in-progress: false

jobs:
  pull-main:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Update existing Windows working copy
        shell: powershell
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: Never
        run: |
          $ErrorActionPreference = 'Stop'
          $repoPath = 'C:\Users\tetsu\Documents\Codex\LangBench-Live'
          if (-not (Test-Path -LiteralPath $repoPath -PathType Container)) {
            throw "Repository folder does not exist: $repoPath"
          }
          Set-Location -LiteralPath $repoPath

          function Invoke-Git {
            $result = & git @args
            if ($LASTEXITCODE -ne 0) {
              throw "Git command failed (exit $LASTEXITCODE): git $($args -join ' ')"
            }
            return $result
          }

          $repoRoot = Invoke-Git rev-parse --show-toplevel
          if ([IO.Path]::GetFullPath($repoRoot).TrimEnd('\') -ine [IO.Path]::GetFullPath($repoPath).TrimEnd('\')) {
            throw 'The configured folder must be the repository root.'
          }
          $remote = Invoke-Git remote get-url origin
          $allowedRemotes = @(
            'https://github.com/tetsujisugimori-coder/LangBench-Live.git',
            'https://github.com/tetsujisugimori-coder/LangBench-Live',
            'git@github.com:tetsujisugimori-coder/LangBench-Live.git'
          )
          if ($allowedRemotes -inotcontains $remote) {
            throw 'origin does not point to the expected repository.'
          }
          $trackedChanges = @(Invoke-Git status --porcelain --untracked-files=no)
          if ($trackedChanges.Count -gt 0) {
            throw 'Tracked files have local changes. Commit or resolve them before retrying.'
          }
          Invoke-Git status --short --branch
          Invoke-Git show-ref --verify refs/heads/main | Out-Null
          Invoke-Git fetch origin refs/heads/main:refs/remotes/origin/main
          & git merge-base --is-ancestor main origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Local main cannot fast-forward to origin/main. Resolve local commits before retrying.'
          }
          Invoke-Git switch main
          Invoke-Git merge --ff-only origin/main
          $localHead = Invoke-Git rev-parse HEAD
          $remoteHead = Invoke-Git rev-parse origin/main
          if ($localHead -ne $remoteHead) {
            throw 'Local main and the fetched origin/main do not match.'
          }
          Invoke-Git status --short --branch
          Invoke-Git log -1 --oneline
          Write-Host "Local main synced: $localHead"
