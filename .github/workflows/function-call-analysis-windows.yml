name: Prepare Windows function-call analysis artifact

# workflow_run loads this workflow from the default branch. PR code cannot dispatch
# a self-hosted job before the PR has been merged and the sync workflow succeeded.
on:
  workflow_run:
    workflows: [Pull local main after verified merge]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: function-call-analysis-windows
  cancel-in-progress: false

jobs:
  authorize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      code_sha: ${{ steps.gate.outputs.code_sha }}
      analysis_id: ${{ steps.gate.outputs.analysis_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify PR-A, fixed main SHA, and completed synchronization
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_RUN_ID: ${{ github.event.workflow_run.id }}
          SYNC_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SYNC_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SYNC_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "/repos/${{ github.repository }}/pulls/69" > "$RUNNER_TEMP/pull.json"
          gh api "/repos/${{ github.repository }}/actions/runs/$SYNC_RUN_ID" > "$RUNNER_TEMP/run.json"
          main_sha=$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          python -B tools/verify_function_call_analysis_gate.py --repository '${{ github.repository }}' \
            --ref '${{ github.ref }}' --main-sha "$main_sha" --sync-sha "$SYNC_SHA" \
            --sync-run-id "$SYNC_RUN_ID" --pull "$RUNNER_TEMP/pull.json" --run "$RUNNER_TEMP/run.json"
          echo "code_sha=$SYNC_SHA" >> "$GITHUB_OUTPUT"
          echo "analysis_id=issue68-pra-69-$SYNC_RUN_ID" >> "$GITHUB_OUTPUT"

  analyze:
    needs: authorize
    runs-on: [self-hosted, Windows, X64, langbench-live-tetsu-windows]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.code_sha }}
          persist-credentials: false
          clean: true
      - name: Reserve a new runner-temporary destination
        id: destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'langbench-analysis-${{ needs.authorize.outputs.analysis_id }}'
          if (Test-Path -LiteralPath $destination) { throw 'analysis destination already exists' }
          "destination=$destination" >> $env:GITHUB_OUTPUT
      - name: Generate and validate the analysis package
        shell: pwsh
        env:
          CODE_SHA: ${{ needs.authorize.outputs.code_sha }}
          ANALYSIS_ID: ${{ needs.authorize.outputs.analysis_id }}
          DESTINATION: ${{ steps.destination.outputs.destination }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CODE_SHA) { throw 'checkout SHA changed' }
          ./tools/generate_function_call_analysis.ps1 -AnalysisId $env:ANALYSIS_ID -OutputDirectory $env:DESTINATION -SharedRepositoryPath 'C:\Users\tetsu\Documents\Codex\LangBench-Live' -ExpectedSha $env:CODE_SHA
      - name: Upload unpublished analysis package even when generation fails
        if: ${{ always() && steps.destination.outputs.destination != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: function-call-analysis-${{ needs.authorize.outputs.analysis_id }}
          path: ${{ steps.destination.outputs.destination }}
          if-no-files-found: warn
          retention-days: 14
